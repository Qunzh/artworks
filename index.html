<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d7ff3d">
<title>Artworks by Kingsley Zheng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion, hushed: a quiet exhibition of one artist's drawings
   IDEA a dark gallery room: each work hangs alone on its own wall, with a small wall label
   PICTURE the works themselves, as large as the screen allows; the opening page lists the titles and shows the works of the one you point at
   COLOUR pure black ground in both themes, white ink, grey for labels, acid lime for the top bar and small details
   TYPE Syne (bold, wide) for the title, names and numbers; Manrope for labels
   LAYOUT a lime bar on top; the index is a split view, titles left and works right; each series then gets its own sliding page. Phone: titles with small pictures, stacked */
:root{color-scheme:dark;--bg:#050505;--ink:#f4f4f1;--mute:#8d8d88;--line:#222222;--acc:#d7ff3d;--on:#050505;--fd:Syne,'Helvetica Neue',Arial,sans-serif;--ft:Manrope,system-ui,-apple-system,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--ft);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button{font:inherit;color:inherit}
/* the top bar is one solid lime band with black type, on every page */
.bar{display:flex;align-items:center;gap:8px;padding:6px max(16px,3vw);background:var(--acc);color:var(--on);border-bottom:1px solid var(--acc)}
.brand{margin-right:auto;background:none;border:0;padding:0 4px 0 0;min-height:44px;font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:-.02em;cursor:pointer;white-space:nowrap}
.count{color:var(--on);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 8px}
.btn{min-width:44px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn:disabled{opacity:.3;cursor:default;border-color:var(--line)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar .btn{border-color:rgba(5,5,5,.3)}
.bar .btn:hover{border-color:var(--on)}
.bar .btn:disabled{border-color:rgba(5,5,5,.3)}
.bar button:focus-visible{outline-color:var(--on)}
.deck{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:clamp(12px,2.5vw,32px) max(16px,3vw) 0}
.art{position:relative;min-height:0;cursor:zoom-in}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.cap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 0 clamp(12px,2.2vw,26px)}
.no{font-family:var(--fd);font-weight:700;font-size:clamp(20px,2.3vw,26px);letter-spacing:-.02em;line-height:1;white-space:nowrap;color:var(--acc)}
.ser{color:var(--mute);font-size:14px}
.detail{margin-left:auto}
/* a series page: its title and dots stay put; the works slide in a track, neighbours dimmed at the edges */
.room-page{grid-template-rows:auto minmax(0,1fr);padding:clamp(12px,2.2vw,28px) 0 0}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px 20px;padding:0 max(16px,3vw) clamp(10px,1.8vw,20px)}
.rhead h2{font-family:var(--fd);font-weight:700;font-size:clamp(20px,2vw,27px);letter-spacing:-.025em;line-height:1.15;margin:0;text-wrap:balance}
.dots{display:flex;flex:none}
.dots button{width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute);opacity:.5;transition:background .3s,opacity .3s,transform .3s}
.dots button[aria-current]::before{background:var(--acc);opacity:1;transform:scale(1.15)}
.track{position:relative;display:flex;gap:clamp(16px,2.6vw,44px);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track::before{content:"";flex:0 0 var(--sl,0px)}
.track::after{content:"";flex:0 0 var(--sr,0px)}
.item{flex:0 0 var(--w,60%);margin:0;display:flex;flex-direction:column;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always;opacity:.28;transition:opacity .45s}
.item.on{opacity:1}
.item:not(.on),.item:not(.on) .art{cursor:pointer}
.item:not(.on):hover{opacity:.5}
.item:not(.on) .detail{visibility:hidden}
.item .art{flex:none;width:var(--w);height:var(--h)}
.cover{display:block;overflow-x:hidden;overflow-y:auto;padding-bottom:clamp(20px,3vw,40px)}
/* the index: titles on the left; point at one and its works appear on the right */
.split{display:grid;grid-template-columns:minmax(300px,36%) minmax(0,1fr);gap:clamp(32px,4.2vw,64px);align-items:start}
.sl{position:sticky;top:0}
.cover h1{font-family:var(--fd);font-weight:700;font-size:clamp(30px,3.1vw,46px);line-height:1.05;letter-spacing:-.035em;margin:0;text-wrap:balance}
.lede{color:var(--mute);font-size:13px;line-height:1.6;margin:10px 0 clamp(18px,3vh,28px);max-width:46ch}
.titles{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.titles li{border-bottom:1px solid var(--line)}
.ti{display:grid;grid-template-columns:clamp(52px,4.6vw,66px) minmax(0,1fr) 22px;align-items:baseline;width:100%;padding:clamp(7px,1.1vh,10px) 0;border:0;background:none;text-align:left;cursor:pointer;color:var(--mute);font-family:var(--fd);font-weight:700;font-size:clamp(17px,1.6vw,23px);line-height:1.12;letter-spacing:-.025em;transition:color .2s}
.ti .rng{font:500 13px/1 var(--ft);letter-spacing:.02em;color:var(--mute);transition:color .2s}
.ti .ar{color:transparent;font-size:.8em;text-align:right;transition:color .2s,transform .2s}
.ti:hover,.ti.on{color:var(--ink)}
.ti.on .rng,.ti.on .ar{color:var(--acc)}
.ti:hover .ar{transform:translateX(3px)}
.mini{display:none}
.sr{min-width:0}
/* a series: its works one under another, the first picture's top level with the top of the title */
.sr.series{display:grid;gap:clamp(22px,3vh,32px);padding-top:var(--cap-top,0px)}
/* a single work: centred in the picture area */
.sr.single{position:sticky;top:0;height:var(--avail,70vh);display:flex;align-items:center;justify-content:center}
.sr figure{margin:0}
.pic{display:block;padding:0;border:0;background:none;cursor:pointer}
.pic img{display:block;transition:opacity .2s}
.pic:hover img{opacity:.85}
.sr figcaption{font-size:12.5px;color:var(--mute);margin-top:8px}
.sr figcaption b{color:var(--acc);font-weight:500;margin-right:8px}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.cover.enter .titles li{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms + 120ms)}
.zoom{position:fixed;inset:0;z-index:10;background:#000;overflow:auto;cursor:zoom-out;overscroll-behavior:contain}
.zoom[hidden]{display:none}
.zoom img{display:block;max-width:none;margin:auto}
.zoom .btn{position:fixed;top:12px;right:max(16px,3vw);background:var(--bg)}
@media(max-width:600px){
.bar{gap:4px}
.brand{font-size:16px}
.btn{padding:0 12px}
.idx{display:none}
.cap{gap:6px 16px}
.detail{display:none}
}
/* phone: no split; each title carries its own small pictures, and a tap opens the series */
@media(max-width:760px){
.split{grid-template-columns:1fr}
.sl{position:static}
.sr,.sr.series,.sr.single{display:none}
.mini{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px clamp(52px,4.6vw,66px)}
.mini img{height:58px;width:auto}
.ti,.ti.on{color:var(--ink)}
.ti .rng,.ti.on .rng{color:var(--acc)}
.ti .ar,.ti.on .ar{color:var(--mute)}
}
@media(prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}.rise,.cover.enter .titles li{animation:none}}
</style>
</head>
<body>
<header class="bar">
  <button class="brand" id="home" type="button">Kingsley Zheng</button>
  <span class="count" id="count" aria-live="polite">19 works</span>
  <button class="btn idx" id="index" type="button">Index</button>
  <button class="btn" id="prev" type="button" aria-label="Previous work">&#8592;</button>
  <button class="btn" id="next" type="button" aria-label="Next work">&#8594;</button>
</header>
<main class="deck" id="deck" tabindex="-1"></main>
<div class="zoom" id="zoom" hidden>
  <img id="zimg" alt="">
  <button class="btn" id="zclose" type="button">Close</button>
</div>
<script>
{
const DIMS=[[2400,1873],[2400,1902],[2400,1842],[2400,1681],[2400,1669],[2400,1674],[2400,1692],[2400,1732],[2400,1562],[2400,1650],[2400,1718],[1037,2400],[976,2400],[2400,1678],[2400,1729],[2400,1734],[2400,1728],[2400,1716],[914,1484]];
/* titles are the artist's own */
const SERIES=[["I",[1,2,3],"Invisible Hands"],["II",[4,5,6],"Strings"],["III",[7,8,9],"It’s not upright, it’s flat"],["IV",[12,13],"Studies on Butterfly patterns"],["V",[15,16],"Birth (Uncompleted)"],["VI",[17,18],"Stuck"]];
const SINGLE={10:"Study on Concave and Convex",11:"Study on Goldfish in a plastic bag",14:"Cosmos of Smoke & Strawberry milk",19:"Butterfly on a leaf (Uncompleted)"};
const N=DIMS.length;
const pad=n=>String(n).padStart(2,"0");
const serOf=n=>SERIES.find(s=>s[1].includes(n));
const big=n=>`works/${pad(n)}.jpg`;
const small=n=>`thumbs/${pad(n)}.jpg`;
const titleOf=n=>{const s=serOf(n);return s?s[2]:SINGLE[n]};
const part=n=>{const s=serOf(n);return s?`${s[1].indexOf(n)+1} of ${s[1].length}`:""};
const label=n=>`No. ${pad(n)}, ${titleOf(n)}${part(n)?", "+part(n):""}`;
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

/* the series and single works, in order */
const groups=[];
for(let n=1;n<=N;n++){
  const s=serOf(n);
  if(s&&s[1][0]!==n)continue;
  groups.push({name:titleOf(n),items:s?s[1]:[n]});
}
const AR=n=>DIMS[n-1][0]/DIMS[n-1][1];
const rngOf=g=>g.items.length>1?`${pad(g.items[0])}–${pad(g.items[g.items.length-1])}`:pad(g.items[0]);
const mini=n=>{const[w,h]=DIMS[n-1];return `<button type="button" class="pic" data-go="${n}" aria-label="Open ${esc(label(n))}"><img src="${small(n)}" width="${Math.round(640*w/Math.max(w,h))}" height="${Math.round(640*h/Math.max(w,h))}" alt="" loading="lazy"></button>`};
/* gentle opening: the titles rise in one by one (only when the index is the first view) */
const introOK=!matchMedia("(prefers-reduced-motion: reduce)").matches&&!/^#work-/.test(location.hash);
const cover=`<section class="slide cover${introOK?" enter":""}" aria-label="Index">
  <div class="split">
    <div class="sl">
      <h1>Artworks by Kingsley Zheng</h1>
      <p class="lede">Nineteen works: six series and four single pieces. All works &copy; Kingsley Zheng.</p>
      <ul class="titles">${groups.map((g,i)=>`<li style="--i:${i}"><button type="button" class="ti" data-g="${i}" data-go="${g.items[0]}"><span class="rng">${rngOf(g)}</span><span>${esc(g.name)}</span><span class="ar" aria-hidden="true">&#8594;</span></button><div class="mini">${g.items.map(mini).join("")}</div></li>`).join("")}</ul>
    </div>
    <div class="sr" id="sr" aria-live="polite"></div>
  </div>
</section>`;

/* one page per series: its works sit in a sliding track, neighbours peeking; a single work gets the same page on its own.
   Each work's label travels with it; the title and dots stay put. */
const roomPage=(g,k)=>{
  const multi=g.items.length>1;
  const dots=multi?`<div class="dots">${g.items.map(n=>`<button type="button" data-go="${n}" aria-label="${esc(label(n))}"></button>`).join("")}</div>`:"";
  const items=g.items.map(n=>{const[w,h]=DIMS[n-1];return `<figure class="item" data-n="${n}">
    <div class="art" data-z="${n}"><img src="${big(n)}" width="${w}" height="${h}" alt="${esc(label(n))}, by Kingsley Zheng" loading="${k<1?"eager":"lazy"}" decoding="async"></div>
    <figcaption class="cap"><span class="no">No. ${pad(n)}</span>${multi?`<span class="ser">${part(n)}</span>`:""}<button class="btn detail" type="button" data-z="${n}">View detail</button></figcaption>
  </figure>`}).join("");
  return `<section class="slide room-page" aria-label="${esc(g.name)}"><header class="rhead"><h2>${esc(g.name)}</h2>${dots}</header><div class="track">${items}</div></section>`;
};

const deck=document.getElementById("deck");
deck.innerHTML=cover+groups.map(roomPage).join("");

const coverEl=deck.querySelector(".cover"),sr=deck.querySelector("#sr"),h1=coverEl.querySelector("h1");
/* how far below the top of its line box the tallest letter of the title starts */
const titleTop=()=>{
  try{
    const cs=getComputedStyle(h1),fs=parseFloat(cs.fontSize),lh=parseFloat(cs.lineHeight)||fs*1.05;
    const c=document.createElement("canvas").getContext("2d");
    c.font=`${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
    const m=c.measureText(h1.textContent);
    if(m.fontBoundingBoxAscent==null)return fs*.16;
    return (lh-(m.fontBoundingBoxAscent+m.fontBoundingBoxDescent))/2+m.fontBoundingBoxAscent-m.actualBoundingBoxAscent;
  }catch(e){return 0}
};
/* pictures as large as the column allows: a series capped so a work fits on screen, a single work filling the picture area */
const sizeIndex=()=>{
  const cs=getComputedStyle(coverEl);
  const avail=coverEl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  coverEl.style.setProperty("--avail",avail+"px");
  sr.style.setProperty("--cap-top",Math.max(0,titleTop()).toFixed(1)+"px");
  const W=sr.clientWidth;if(!W)return;
  const single=sr.classList.contains("single");
  const maxH=single?avail-44:Math.min(560,innerHeight*.64);
  sr.querySelectorAll(".pic img").forEach(im=>{const ar=AR(+im.parentNode.dataset.go),w=Math.min(W,maxH*ar);im.style.width=Math.floor(w)+"px";im.style.height=Math.floor(w/ar)+"px"});
};
let shown=-1;
const showGroup=(gi,animate)=>{
  if(gi===shown)return;shown=gi;
  const g=groups[gi],multi=g.items.length>1;
  deck.querySelectorAll(".ti").forEach(b=>b.classList.toggle("on",+b.dataset.g===gi));
  sr.className="sr "+(multi?"series":"single");
  sr.innerHTML=g.items.map((n,j)=>`<figure${animate?` class="rise" style="animation-delay:${j*70}ms"`:""}><button type="button" class="pic" data-go="${n}" aria-label="Open ${esc(label(n))}"><img src="${small(n)}" alt="${esc(label(n))}, by Kingsley Zheng"></button><figcaption><b>No. ${pad(n)}</b>${multi?part(n):""}</figcaption></figure>`).join("");
  sizeIndex();
  /* the small picture shows at once; the full one replaces it when it arrives */
  sr.querySelectorAll(".pic img").forEach(im=>{const n=+im.parentNode.dataset.go,b=new Image();b.onload=()=>{if(im.isConnected)im.src=b.src};b.src=big(n)});
};
const pick=e=>{const t=e.target.closest(".ti");if(t&&e.pointerType!=="touch")showGroup(+t.dataset.g,true)};
coverEl.addEventListener("pointerover",pick);
coverEl.addEventListener("focusin",e=>{const t=e.target.closest(".ti");if(t)showGroup(+t.dataset.g,true)});
showGroup(0,introOK);
if(introOK)setTimeout(()=>coverEl.classList.remove("enter"),1400);
new ResizeObserver(sizeIndex).observe(coverEl);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sizeIndex);

const count=document.getElementById("count"),prev=document.getElementById("prev"),next=document.getElementById("next");
const reduce=matchMedia("(prefers-reduced-motion: reduce)");
let cur=-1;
const pages=[...deck.querySelectorAll(".slide")];
const tracks=pages.map(pg=>pg.querySelector(".track"));
const pageOf=i=>i===0?0:groups.findIndex(g=>g.items.includes(i))+1;
const deckPage=()=>Math.round(deck.scrollLeft/Math.max(1,deck.clientWidth));
const itemsOf=tr=>[...tr.querySelectorAll(".item")];
const itemOf=n=>deck.querySelector(`.item[data-n="${n}"]`);
/* each work as large as the track allows, but no wider than ~70% of the page so its neighbours show */
const layoutTracks=()=>{
  const W=deck.clientWidth;if(!W)return;
  const maxW=W*(W<700?.8:.68);
  tracks.forEach(tr=>{
    if(!tr)return;
    const its=itemsOf(tr),capH=its[0].querySelector(".cap").offsetHeight;
    const H=Math.max(100,tr.clientHeight-capH),gap=parseFloat(getComputedStyle(tr).columnGap)||0;
    let wf=0,wl=0;
    its.forEach((it,j)=>{const ar=AR(+it.dataset.n),w=Math.floor(Math.min(maxW,H*ar));it.style.setProperty("--w",w+"px");it.style.setProperty("--h",Math.floor(w/ar)+"px");if(!j)wf=w;wl=w});
    tr.style.setProperty("--sl",Math.max(0,(W-wf)/2-gap)+"px");
    tr.style.setProperty("--sr",Math.max(0,(W-wl)/2-gap)+"px");
  });
};
const centre=(tr,it,behavior)=>tr.scrollTo({left:it.offsetLeft+it.offsetWidth/2-tr.clientWidth/2,behavior});
/* the work in the middle of a track is lit, with its dot */
const markOn=tr=>{
  const mid=tr.scrollLeft+tr.clientWidth/2;let best=null,bd=Infinity;
  itemsOf(tr).forEach(it=>{const d=Math.abs(it.offsetLeft+it.offsetWidth/2-mid);if(d<bd){bd=d;best=it}});
  itemsOf(tr).forEach(it=>it.classList.toggle("on",it===best));
  const n=+best.dataset.n;
  tr.parentNode.querySelectorAll(".dots button").forEach(b=>{if(+b.dataset.go===n)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
  return n;
};
/* pages before the current one wait at their last work, pages after at their first, so swiping reads in order */
const presetOthers=()=>{const cp=pageOf(cur);tracks.forEach((tr,p)=>{if(!tr||p===cp)return;const its=itemsOf(tr);centre(tr,p<cp?its[its.length-1]:its[0],"auto");markOn(tr)})};
layoutTracks();
const setCur=i=>{
  if(i===cur)return;cur=i;
  count.textContent=i===0?`${N} works`:`${pad(i)} / ${N}`;
  prev.disabled=i===0;next.disabled=i===N;
  const h=i===0?"#index":`#work-${pad(i)}`;
  try{if(location.hash!==h)history.replaceState(null,"",h)}catch(e){}
};
const go=(i,smooth)=>{
  i=Math.max(0,Math.min(N,i));
  const p=pageOf(i),cp=deckPage(),beh=smooth&&!reduce.matches?"smooth":"auto";
  if(p>0){const tr=tracks[p];centre(tr,itemOf(i),p===cp?beh:"auto");if(p!==cp||beh==="auto")markOn(tr)}
  if(p!==cp)deck.scrollTo({left:p*deck.clientWidth,behavior:beh});
  setCur(i);
};
let raf=0,settle=0;
deck.addEventListener("scroll",()=>{
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{const p=deckPage();if(p!==pageOf(cur))setCur(p===0?0:markOn(tracks[p]))});
  clearTimeout(settle);settle=setTimeout(presetOthers,200);
},{passive:true});
tracks.forEach((tr,p)=>{
  if(!tr)return;let r=0;
  tr.addEventListener("scroll",()=>{cancelAnimationFrame(r);r=requestAnimationFrame(()=>{const n=markOn(tr);if(p===deckPage()&&p===pageOf(cur)&&n!==cur)setCur(n)})},{passive:true});
});
const relayout=()=>{
  layoutTracks();if(cur<0)return;
  const p=pageOf(cur);deck.scrollLeft=p*deck.clientWidth;
  if(p>0){centre(tracks[p],itemOf(cur),"auto");markOn(tracks[p])}
  presetOthers();
};
const deckRO=new ResizeObserver(relayout);
deckRO.observe(deck);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(relayout);

const fromHash=()=>{const m=/^#work-(\d{1,2})$/.exec(location.hash);return m?+m[1]:0};
window.addEventListener("hashchange",()=>{const i=fromHash();if(i!==cur)go(i,false)});

/* detail view at full resolution, opened where the viewer clicked */
const zoom=document.getElementById("zoom"),zimg=document.getElementById("zimg");
const openZoom=(n,e,box)=>{
  const[w,h]=DIMS[n-1];
  let fx=.5,fy=.5;
  if(e&&box){
    const r=box.getBoundingClientRect(),k=Math.min(r.width/w,r.height/h),iw=w*k,ih=h*k;
    fx=Math.max(0,Math.min(1,(e.clientX-r.left-(r.width-iw)/2)/iw));
    fy=Math.max(0,Math.min(1,(e.clientY-r.top-(r.height-ih)/2)/ih));
  }
  const scale=Math.max(1,Math.min(w,Math.max(innerWidth*1.6,innerHeight*1.6*w/h))/w);
  const zw=Math.round(w*Math.min(1,scale)),zh=Math.round(h*zw/w);
  zimg.src=big(n);zimg.alt=`${label(n)}, detail`;zimg.width=zw;zimg.height=zh;
  zoom.hidden=false;
  zoom.scrollLeft=Math.max(0,fx*zw-zoom.clientWidth/2);
  zoom.scrollTop=Math.max(0,fy*zh-zoom.clientHeight/2);
  document.getElementById("zclose").focus({preventScroll:true});
};
const closeZoom=()=>{zoom.hidden=true;deck.focus({preventScroll:true})};
zoom.addEventListener("click",closeZoom);

deck.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){go(+g.dataset.go,true);return}
  const it=e.target.closest(".item");
  if(it&&!it.classList.contains("on")){go(+it.dataset.n,true);return}
  const z=e.target.closest("[data-z]");
  if(z)openZoom(+z.dataset.z,z.classList.contains("art")?e:null,z.classList.contains("art")?z:null);
});
document.getElementById("home").addEventListener("click",()=>go(0,true));
document.getElementById("index").addEventListener("click",()=>go(0,true));
prev.addEventListener("click",()=>go(cur-1,true));
next.addEventListener("click",()=>go(cur+1,true));
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(!zoom.hidden){if(e.key==="Escape")closeZoom();return}
  const k={ArrowRight:1,PageDown:1,ArrowLeft:-1,PageUp:-1}[e.key];
  if(k){e.preventDefault();go(cur+k,true)}
  else if(e.key==="Home"){e.preventDefault();go(0,true)}
  else if(e.key==="End"){e.preventDefault();go(N,true)}
});

requestAnimationFrame(()=>{go(fromHash(),false);presetOthers()});
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d7ff3d">
<title>Artworks by Kingsley Zheng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion, hushed: a small exhibition of one artist's drawings
   IDEA one page: the titles of every series down the left; point at one and its works hang on the right
   PICTURE the works themselves, out to the page's right margin; any work opens full size for a closer look
   COLOUR pure black ground in both themes, white ink, grey for labels, acid lime for the top bar, the chosen title and small details
   TYPE Syne (bold, wide) for the title, names and numbers; Manrope for labels
   LAYOUT a lime bar on top; titles left, works right: a series hangs one work under another (a pair of tall works side by side),
          a single work sits centred. Phone: one list; tap a title to open its works underneath */
:root{color-scheme:dark;--bg:#050505;--ink:#f4f4f1;--mute:#8d8d88;--line:#222222;--acc:#d7ff3d;--on:#050505;--fd:Syne,'Helvetica Neue',Arial,sans-serif;--ft:Manrope,system-ui,-apple-system,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--ft);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* the top bar is one solid lime band with black type */
.bar{display:flex;align-items:center;gap:8px;padding:6px max(16px,3vw);background:var(--acc);color:var(--on)}
.brand{margin-right:auto;background:none;border:0;padding:0 4px 0 0;min-height:44px;font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:-.02em;cursor:pointer;white-space:nowrap}
.bar button:focus-visible{outline-color:var(--on)}

/* the index is the whole site; the page margin is the same on both sides, and the pictures run out to it */
.cover{height:100%;overflow-x:hidden;overflow-y:auto;padding:clamp(12px,2.5vw,32px) max(16px,3vw) clamp(20px,3vw,40px)}
.split{display:grid;grid-template-columns:minmax(300px,36%) minmax(0,1fr);gap:clamp(32px,4.2vw,64px);align-items:start}
.sl{position:sticky;top:0}
.cover h1{font-family:var(--fd);font-weight:700;font-size:clamp(30px,3.1vw,46px);line-height:1.05;letter-spacing:-.035em;margin:0;text-wrap:balance}
.lede{color:var(--mute);font-size:13px;line-height:1.6;margin:10px 0 clamp(18px,3vh,28px)}
.titles{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.titles li{border-bottom:1px solid var(--line)}
.ti{display:grid;grid-template-columns:clamp(52px,4.6vw,66px) minmax(0,1fr) 22px;align-items:baseline;width:100%;padding:clamp(7px,1.1vh,10px) 0;border:0;background:none;text-align:left;cursor:pointer;color:var(--mute);font-family:var(--fd);font-weight:700;font-size:clamp(17px,1.6vw,23px);line-height:1.12;letter-spacing:-.025em;transition:color .2s}
.ti .rng{font:500 13px/1 var(--ft);letter-spacing:.02em;color:var(--mute);transition:color .2s}
.ti .ar{color:transparent;font-size:.8em;text-align:right;transition:color .2s,transform .2s}
.ti:hover,.ti.on{color:var(--acc)}
.ti.on .rng,.ti.on .ar{color:var(--acc)}
.ti:hover .ar{transform:translateX(3px)}
.drawer{display:none}
.sr{min-width:0}
/* a series: its works one under another at the full width, the first picture's top level with the top of the title */
.sr.series{display:grid;gap:clamp(22px,3vh,32px);padding-top:var(--cap-top,0px)}
.sr.series figure{width:fit-content;max-width:100%;scroll-margin-top:clamp(12px,2.5vw,32px)}
/* scroll cue: a lime pill that rides the bottom of the screen through a long series, counting the works,
   and fades away once the last one is in view (not used for the side-by-side pair) */
.cue-wrap{position:sticky;bottom:clamp(14px,2.4vh,24px);height:0;justify-self:center;z-index:2}
.cue{display:inline-flex;align-items:center;gap:10px;transform:translateY(-100%);padding:9px 16px 9px 14px;border:0;border-radius:999px;background:var(--acc);color:var(--on);font:500 13px/1 var(--ft);white-space:nowrap;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.55);transition:opacity .35s,transform .35s}
.cue .arr{display:inline-block;font-size:15px;animation:bob 1.4s ease-in-out infinite}
.cue .cnt{padding-left:10px;border-left:1px solid rgba(5,5,5,.3);font-variant-numeric:tabular-nums}
.cue:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@keyframes bob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.cue-wrap.done .cue{opacity:0;transform:translateY(-40%);pointer-events:none}
/* a pair of tall works: side by side, filling the width together */
.sr.pair{grid-template-columns:repeat(2,auto);justify-content:start;column-gap:20px}
/* a single work: as large as fits, centred in the picture area */
.sr.single{position:sticky;top:0;height:var(--avail,70vh);display:flex;align-items:center;justify-content:center}
figure{margin:0}
.pic{display:block;padding:0;border:0;background:none;cursor:zoom-in}
.pic img{display:block;transition:opacity .2s}
.pic:hover img{opacity:.85}
figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--mute);margin-top:10px}
figcaption b{color:var(--acc);font-weight:500}
.vd{margin-left:auto;border:1px solid var(--line);border-radius:999px;background:none;padding:5px 12px;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s}
.vd:hover{border-color:var(--acc);color:var(--acc)}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.cover.enter .titles li{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms + 120ms)}

/* detail view at full resolution */
.zoom{position:fixed;inset:0;z-index:10;background:#000;overflow:auto;cursor:zoom-out;overscroll-behavior:contain}
.zoom[hidden]{display:none}
.zoom img{display:block;max-width:none;margin:auto}
.zclose{position:fixed;top:12px;right:max(16px,3vw);min-width:44px;min-height:44px;padding:0 16px;border:1px solid var(--acc);border-radius:999px;background:var(--acc);color:var(--on);font-size:14px;cursor:pointer}
.zclose:focus-visible{outline-color:var(--acc)}
.zlabel{position:fixed;left:max(16px,3vw);bottom:14px;margin:0;padding:6px 12px;border-radius:999px;background:rgba(5,5,5,.75);font-size:13px;pointer-events:none}
.zlabel b{color:var(--acc);font-weight:500;margin-right:8px}

/* phone: no split; tap a title to open its works underneath */
@media(max-width:760px){
.split{grid-template-columns:1fr}
.sl{position:static}
.sr,.sr.series,.sr.single{display:none}
.titles li.open .drawer{display:grid;gap:24px;padding:6px 0 24px}
.titles li.open .drawer.pair{gap:24px 12px}
.drawer img{width:100%;height:auto}
.ti,.ti.on{color:var(--ink)}
.ti .rng,.ti.on .rng{color:var(--acc)}
.ti .ar,.ti.on .ar{color:var(--mute)}
.titles li.open .ti{color:var(--acc)}
.titles li.open .ar{color:var(--acc);transform:rotate(90deg)}
.brand{font-size:16px}
}
@media(prefers-reduced-motion:reduce){.rise,.cover.enter .titles li,.cue .arr{animation:none}}
</style>
</head>
<body>
<header class="bar">
  <button class="brand" id="home" type="button">Kingsley Zheng</button>
</header>
<main class="cover" id="cover" tabindex="-1" aria-label="Index"></main>
<div class="zoom" id="zoom" hidden>
  <img id="zimg" alt="">
  <p class="zlabel" id="zlabel"></p>
  <button class="zclose" id="zclose" type="button">Close</button>
</div>
<script>
{
const DIMS=[[2400,1873],[2400,1902],[2400,1842],[2400,1681],[2400,1669],[2400,1674],[2400,1692],[2400,1732],[2400,1562],[2400,1650],[2400,1718],[1037,2400],[976,2400],[2400,1678],[2400,1729],[2400,1734],[2400,1728],[2400,1716],[914,1484]];
/* titles are the artist's own */
const SERIES=[["I",[1,2,3],"Invisible Hands"],["II",[4,5,6],"Strings"],["III",[7,8,9],"It’s not upright, it’s flat"],["IV",[12,13],"Studies on Butterfly patterns"],["V",[15,16],"Birth (Uncompleted)"],["VI",[17,18],"Stuck"]];
const SINGLE={10:"Study on Concave and Convex",11:"Study on Goldfish in a plastic bag",14:"Cosmos of Smoke & Strawberry milk",19:"Butterfly on a leaf (Uncompleted)"};
const N=DIMS.length;
const pad=n=>String(n).padStart(2,"0");
const serOf=n=>SERIES.find(s=>s[1].includes(n));
const big=n=>`works/${pad(n)}.jpg`;
const small=n=>`thumbs/${pad(n)}.jpg`;
const titleOf=n=>{const s=serOf(n);return s?s[2]:SINGLE[n]};
const part=n=>{const s=serOf(n);return s?`${s[1].indexOf(n)+1} of ${s[1].length}`:""};
const label=n=>`No. ${pad(n)}, ${titleOf(n)}${part(n)?", "+part(n):""}`;
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const AR=n=>DIMS[n-1][0]/DIMS[n-1][1];

/* the series and single works, in order; a series of tall works hangs as a side-by-side pair */
const groups=[];
for(let n=1;n<=N;n++){
  const s=serOf(n);
  if(s&&s[1][0]!==n)continue;
  const items=s?s[1]:[n];
  groups.push({name:titleOf(n),items,pair:items.length>1&&items.every(m=>AR(m)<1)});
}
const rngOf=g=>g.items.length>1?`${pad(g.items[0])}–${pad(g.items[g.items.length-1])}`:pad(g.items[0]);
/* one work: the picture opens the detail view, and so does the button in its label */
const fig=(n,lazy,anim)=>{const[w,h]=DIMS[n-1];return `<figure${anim||""}><button type="button" class="pic" data-z="${n}" aria-label="View ${esc(label(n))} in detail"><img src="${small(n)}" width="${Math.round(640*w/Math.max(w,h))}" height="${Math.round(640*h/Math.max(w,h))}" alt="${esc(label(n))}, by Kingsley Zheng"${lazy?' loading="lazy"':""}></button><figcaption><b>No. ${pad(n)}</b>${serOf(n)?`<span>${part(n)}</span>`:""}<button type="button" class="vd" data-z="${n}">View detail</button></figcaption></figure>`};

/* gentle opening: the titles rise in one by one */
const introOK=!matchMedia("(prefers-reduced-motion: reduce)").matches;
const coverEl=document.getElementById("cover");
if(introOK)coverEl.classList.add("enter");
coverEl.innerHTML=`<div class="split">
  <div class="sl">
    <h1>Artworks by Kingsley Zheng</h1>
    <p class="lede">All works &copy; Kingsley Zheng.</p>
    <ul class="titles">${groups.map((g,i)=>`<li style="--i:${i}"><button type="button" class="ti" data-g="${i}" aria-expanded="false"><span class="rng">${rngOf(g)}</span><span>${esc(g.name)}</span><span class="ar" aria-hidden="true">&#8594;</span></button><div class="drawer${g.pair?" pair":""}"${g.pair?` style="grid-template-columns:${g.items.map(n=>(AR(n)*10).toFixed(3)+"fr").join(" ")}"`:""}>${g.items.map(n=>fig(n,true)).join("")}</div></li>`).join("")}</ul>
  </div>
  <div class="sr" id="sr" aria-live="polite"></div>
</div>`;
const sr=document.getElementById("sr"),h1=coverEl.querySelector("h1"),lis=[...coverEl.querySelectorAll(".titles li")];
const phone=matchMedia("(max-width: 760px)");

/* the small picture shows at once; the full one replaces it when it arrives */
const sharpen=root=>root.querySelectorAll(".pic img").forEach(im=>{const n=+im.parentNode.dataset.z;if(im.src.endsWith(big(n)))return;const b=new Image();b.onload=()=>{if(im.isConnected)im.src=b.src};b.src=big(n)});

/* how far below the top of its line box the tallest letter of the title starts */
const titleTop=()=>{
  try{
    const cs=getComputedStyle(h1),fs=parseFloat(cs.fontSize),lh=parseFloat(cs.lineHeight)||fs*1.05;
    const c=document.createElement("canvas").getContext("2d");
    c.font=`${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
    const m=c.measureText(h1.textContent);
    if(m.fontBoundingBoxAscent==null)return fs*.16;
    return (lh-(m.fontBoundingBoxAscent+m.fontBoundingBoxDescent))/2+m.fontBoundingBoxAscent-m.actualBoundingBoxAscent;
  }catch(e){return 0}
};
/* every picture as large as the column: a series at the full width (a pair filling it together),
   a single work as large as fits on screen, centred */
const sizeIndex=()=>{
  const cs=getComputedStyle(coverEl);
  const avail=coverEl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  coverEl.style.setProperty("--avail",avail+"px");
  sr.style.setProperty("--cap-top",Math.max(0,titleTop()).toFixed(1)+"px");
  const W=sr.clientWidth;if(!W)return;
  const imgs=[...sr.querySelectorAll(".pic img")],arOf=im=>AR(+im.parentNode.dataset.z);
  const set=(im,w)=>{im.style.width=Math.floor(w)+"px";im.style.height=Math.floor(w/arOf(im))+"px"};
  if(sr.classList.contains("single"))imgs.forEach(im=>set(im,Math.min(W,(avail-54)*arOf(im))));
  else if(sr.classList.contains("pair")){const gap=parseFloat(getComputedStyle(sr).columnGap)||0,h=(W-gap*(imgs.length-1))/imgs.reduce((s,im)=>s+arOf(im),0);imgs.forEach(im=>set(im,h*arOf(im)))}
  else imgs.forEach(im=>set(im,W));
};
/* computer: the chosen title turns lime and its works hang on the right */
let shown=-1;
const showGroup=(gi,animate)=>{
  if(gi===shown)return;shown=gi;
  const g=groups[gi];
  coverEl.querySelectorAll(".ti").forEach(b=>b.classList.toggle("on",+b.dataset.g===gi));
  sr.className="sr "+(g.items.length>1?"series":"single")+(g.pair?" pair":"");
  coverEl.scrollTop=0;
  sr.innerHTML=g.items.map((n,j)=>fig(n,false,animate?` class="rise" style="animation-delay:${j*70}ms"`:"")).join("")
    +(g.items.length>1&&!g.pair?`<div class="cue-wrap"><button type="button" class="cue" aria-label="Scroll to the next work"><span class="arr" aria-hidden="true">&#8595;</span>Scroll<span class="cnt">1 / ${g.items.length}</span></button></div>`:"");
  sizeIndex();sharpen(sr);updateCue();
};
/* the cue counts the work in view and disappears at the bottom of the series */
const updateCue=()=>{
  const wrap=sr.querySelector(".cue-wrap");if(!wrap)return;
  const figs=[...sr.querySelectorAll("figure")],mid=coverEl.getBoundingClientRect().top+coverEl.clientHeight*.5;
  let k=0;figs.forEach((f,i)=>{if(f.getBoundingClientRect().top<=mid)k=i});
  wrap.querySelector(".cnt").textContent=`${k+1} / ${figs.length}`;
  wrap.classList.toggle("done",coverEl.scrollTop+coverEl.clientHeight>=coverEl.scrollHeight-6);
  return {figs,k};
};
let cueRaf=0;
coverEl.addEventListener("scroll",()=>{cancelAnimationFrame(cueRaf);cueRaf=requestAnimationFrame(updateCue)},{passive:true});
/* phone: a tap opens a title's works underneath it, and closes the one that was open */
const openOnPhone=gi=>{
  const li=lis[gi],open=!li.classList.contains("open");
  lis.forEach(l=>{l.classList.remove("open");l.querySelector(".ti").setAttribute("aria-expanded","false")});
  if(!open)return;
  li.classList.add("open");li.querySelector(".ti").setAttribute("aria-expanded","true");
  sharpen(li);
  requestAnimationFrame(()=>li.scrollIntoView({block:"start",behavior:introOK?"smooth":"auto"}));
};
coverEl.addEventListener("pointerover",e=>{const t=e.target.closest(".ti");if(t&&e.pointerType!=="touch"&&!phone.matches)showGroup(+t.dataset.g,true)});
coverEl.addEventListener("focusin",e=>{const t=e.target.closest(".ti");if(t&&!phone.matches)showGroup(+t.dataset.g,true)});

/* detail view at full resolution, opened where the viewer clicked */
const zoom=document.getElementById("zoom"),zimg=document.getElementById("zimg"),zlabel=document.getElementById("zlabel");
let lastFocus=null;
const openZoom=(n,e,box)=>{
  const[w,h]=DIMS[n-1];
  let fx=.5,fy=.5;
  if(e&&box){
    const r=box.getBoundingClientRect(),k=Math.min(r.width/w,r.height/h),iw=w*k,ih=h*k;
    fx=Math.max(0,Math.min(1,(e.clientX-r.left-(r.width-iw)/2)/iw));
    fy=Math.max(0,Math.min(1,(e.clientY-r.top-(r.height-ih)/2)/ih));
  }
  const scale=Math.max(1,Math.min(w,Math.max(innerWidth*1.6,innerHeight*1.6*w/h))/w);
  const zw=Math.round(w*Math.min(1,scale)),zh=Math.round(h*zw/w);
  lastFocus=document.activeElement;
  zimg.src=big(n);zimg.alt=`${label(n)}, detail`;zimg.width=zw;zimg.height=zh;
  zlabel.innerHTML=`<b>No. ${pad(n)}</b>${esc(titleOf(n))}${part(n)?", "+part(n):""}`;
  zoom.hidden=false;
  zoom.scrollLeft=Math.max(0,fx*zw-zoom.clientWidth/2);
  zoom.scrollTop=Math.max(0,fy*zh-zoom.clientHeight/2);
  document.getElementById("zclose").focus({preventScroll:true});
};
const closeZoom=()=>{zoom.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})};
zoom.addEventListener("click",closeZoom);

coverEl.addEventListener("click",e=>{
  if(e.target.closest(".cue")){const c=updateCue();if(c&&c.figs[c.k+1])c.figs[c.k+1].scrollIntoView({block:"start",behavior:introOK?"smooth":"auto"});return}
  const z=e.target.closest("[data-z]");
  if(z){const im=z.classList.contains("pic")?z.querySelector("img"):null;openZoom(+z.dataset.z,im?e:null,im);return}
  const t=e.target.closest(".ti");
  if(t){if(phone.matches)openOnPhone(+t.dataset.g);else showGroup(+t.dataset.g,true)}
});
document.getElementById("home").addEventListener("click",()=>coverEl.scrollTo({top:0,behavior:introOK?"smooth":"auto"}));
document.addEventListener("keydown",e=>{if(!zoom.hidden&&e.key==="Escape")closeZoom()});

/* start on the first series, or on the one an old link points to */
const m=/^#work-(\d{1,2})$/.exec(location.hash);
const startG=m?Math.max(0,groups.findIndex(g=>g.items.includes(+m[1]))):0;
showGroup(startG,introOK);
if(phone.matches)openOnPhone(startG);
if(introOK)setTimeout(()=>coverEl.classList.remove("enter"),1400);
new ResizeObserver(()=>{sizeIndex();updateCue()}).observe(coverEl);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sizeIndex);
}
</script>
</body>
</html>
